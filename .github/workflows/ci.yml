# Continuous integration.
#
# The syllabus requires working tests invoked via CI each week. This workflow is
# deliberately minimal and language-agnostic: replace the "Run tests" step with
# whatever your project actually uses (pytest, npm test, mvn test, go test, ...)
# and add a setup step for your language.
#
# A red build is not a penalty in itself. A build that has been red for weeks,
# or a green build that runs no tests, is the thing to avoid.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

